<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#07080d" />
    <meta name="description" content="Трёхмерный терминал Renfild: портфолио по публичным репозиториям GitHub." />
    <title>Renfild — терминал</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%230c0f0c' width='16' height='16'/%3E%3Crect fill='%237CFF6B' x='2' y='3' width='8' height='10'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/terminal.css" />
    <link rel="stylesheet" href="css/scene.css" />
  </head>
  <body>
    <a class="skip" href="#cmd">К командной строке</a>
    <div class="world" id="world">
      <div class="city" aria-hidden="true">
        <div class="skyline">
          <i class="tower" style="--x: 4%; --w: 7%; --h: 46%"></i>
          <i class="tower" style="--x: 12%; --w: 5%; --h: 62%"></i>
          <i class="tower" style="--x: 18%; --w: 9%; --h: 38%"></i>
          <i class="tower" style="--x: 28%; --w: 4%; --h: 54%"></i>
          <i class="tower" style="--x: 70%; --w: 8%; --h: 58%"></i>
          <i class="tower" style="--x: 79%; --w: 5%; --h: 42%"></i>
          <i class="tower" style="--x: 86%; --w: 10%; --h: 50%"></i>
          <i class="tower" style="--x: 93%; --w: 4%; --h: 34%"></i>
        </div>
        <div class="window"></div>
        <div class="street"></div>
        <div class="desk"></div>
        <div class="rain"></div>
        <div class="rain rain-far"></div>
      </div>
      <div class="signs">
        <div class="rail">
          <button class="sign sign-pink" type="button" data-cmd="whoami" aria-label="whoami">RENFILD</button>
          <button class="sign sign-cyan" type="button" data-cmd="open aquateche" aria-label="open aquateche">AQUA</button>
          <button class="sign sign-green" type="button" data-cmd="open pcai" aria-label="open pcai">RAG</button>
        </div>
        <div class="rail rail-right">
          <button class="sign sign-amber" type="button" data-cmd="open tgbotshop" aria-label="open tgbotshop">SHOP</button>
          <button class="sign sign-violet" type="button" data-cmd="open tamagotchi-bot" aria-label="open tamagotchi-bot">PET</button>
          <button class="sign sign-ice" type="button" data-cmd="contact" aria-label="contact">GIT</button>
        </div>
      </div>
      <div class="rig" id="rig">
        <div class="monitor">
          <div class="bezel">
            <div class="bezel-top">
              <span>TERMINAL</span>
              <span class="leds" aria-hidden="true"><i></i><i></i><i></i></span>
            </div>
            <div class="glass">
              <div class="app">
                <header class="top">
                  <div class="top-inner">
                    <h1 class="brand"><span class="accent">renfild</span><span class="dim">@github</span></h1>
                    <a href="https://github.com/Renfild">github.com/Renfild</a>
                  </div>
                </header>
                <div class="frame">
                  <div id="output" class="output" role="log" aria-label="Вывод терминала">
                    <noscript><p class="p">Нужен JavaScript: терминал выполняется в браузере.</p></noscript>
                  </div>
                  <div class="dock">
                    <p id="status" class="status"></p>
                    <div id="quick" class="quick" role="group" aria-label="Команды"></div>
                    <form id="form">
                      <div class="cmdline">
                        <label class="sr" for="cmd">Команда</label>
                        <span id="prompt" class="prompt" aria-hidden="true"></span>
                        <span id="field" class="field">
                          <span class="mirror" aria-hidden="true"><span id="before"></span><span id="selected" class="selected" hidden></span><span id="caret" class="caret"></span><span id="ghost" class="ghost"></span><span id="after"></span></span>
                          <input id="cmd" name="terminal-command" aria-describedby="hint" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" maxlength="240" />
                        </span>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
              <div class="scan" aria-hidden="true"></div>
              <div class="glare" aria-hidden="true"></div>
            </div>
            <div class="chin">
              <span>RENFILD</span>
              <a href="https://github.com/Renfild">github</a>
            </div>
          </div>
        </div>
        <div class="deck">
          <div id="keyboard" class="keyboard" role="group" aria-label="Клавиатура терминала"></div>
        </div>
        <div class="mug" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <p id="hint" class="sr">Tab дополняет команды и имена репозиториев. Стрелки листают историю. Неоновые вывески открывают проекты. Поводите курсором, чтобы осмотреть комнату.</p>
    <script type="module" src="js/terminal.js"></script>
    <script type="module" src="js/scene.js"></script>
  </body>
</html>
